<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hopital')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container mt-4" style="max-width: 750px;">
    <h2 class="mb-3" th:text="${edition} ? 'Modifier un hopital' : 'Nouvel hopital'"></h2>

    <form th:action="${edition} ? @{/admin/hopitaux/{id}(id=${hopital.id})} : @{/admin/hopitaux}"
          th:object="${hopital}" method="post">

        <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
            <div th:each="e : ${#fields.errors('*')}" th:text="${e}"></div>
        </div>
        <div class="row">
            <div class="col-md-8 mb-3">
                <label class="form-label">Nom</label>
                <input type="text" th:field="*{nom}" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Ville</label>
                <input type="text" th:field="*{ville}" class="form-control">
            </div>
            <div class="col-md-12 mb-3">
                <label class="form-label">Adresse</label>
                <input type="text" th:field="*{adresse}" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Telephone</label>
                <input type="text" th:field="*{telephone}" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Ouverture</label>
                <input type="time" th:field="*{heureOuverture}" class="form-control">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Fermeture</label>
                <input type="time" th:field="*{heureFermeture}" class="form-control">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Creneau (min)</label>
                <input type="number" th:field="*{dureeCreneauMin}" class="form-control">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Capacite</label>
                <input type="number" th:field="*{capaciteParCreneau}" class="form-control">
            </div>
            <div class="col-12 mb-3">
                <label>
                    <input type="checkbox" th:field="*{valide}"> Hopital valide
                </label>
            </div>
        </div>
        <button type="submit" class="btn btn-danger">Enregistrer</button>
        <a class="btn btn-link" th:href="@{/admin/hopitaux}">Annuler</a>
    </form>
</div>
</body>
</html>
