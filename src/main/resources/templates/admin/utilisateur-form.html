<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nouveau compte')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4" style="max-width: 600px;">
    <h2 class="mb-3">Nouveau compte du personnel</h2>

    <form th:action="@{/admin/utilisateurs}" th:object="${form}" method="post">

        <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
            <div th:each="e : ${#fields.errors('*')}" th:text="${e}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" th:field="*{motDePasse}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Role</label>
            <select th:field="*{role}" class="form-select">
                <option value="">--</option>
                <option th:each="r : ${rolesPersonnel}" th:value="${r}" th:text="${r}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Hopital</label>
            <select th:field="*{hopitalId}" class="form-select">
                <option value="">--</option>
                <option th:each="h : ${hopitaux}" th:value="${h.id}" th:text="${h.nom} + ' (' + ${h.ville} + ')'"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-danger">Creer le compte</button>
        <a class="btn btn-link" th:href="@{/admin/utilisateurs}">Annuler</a>
    </form>
</div>
</body>
</html>
