<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rendez-vous')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4" style="max-width: 700px;">
    <h2>Prendre rendez-vous</h2>
    <p class="text-muted" th:text="${hopital.nom} + ' - ' + ${hopital.ville}"></p>
    <div th:replace="~{fragments/layout :: messages}"></div>
    <!-- jour -->
    <form class="row g-2 mb-4" method="get" th:action="@{/donneur/hopitaux/{id}/rendez-vous(id=${hopital.id})}">
        <div class="col-auto">
            <input type="date" name="jour" th:value="${jour}" class="form-control">
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-danger">Voir les creneaux</button>
        </div>
    </form>

    <!-- creneau -->
    <form method="post" th:action="@{/donneur/rendez-vous}" th:if="${!#lists.isEmpty(creneaux)}">
        <input type="hidden" name="hopitalId" th:value="${hopital.id}">
        <ul class="list-group mb-3">
            <li class="list-group-item d-flex justify-content-between" th:each="c : ${creneaux}">
                <label>
                    <input type="radio" name="dateHeure" th:value="${c.dateHeure}"
                           th:disabled="${c.placesRestantes == 0}" required>
                    <span th:text="${#temporals.format(c.dateHeure, 'HH:mm')}"></span>
                </label>
                <span th:if="${c.placesRestantes == 0}" class="badge bg-secondary">Complet</span>
                <span th:if="${c.placesRestantes > 0}" class="badge bg-success"
                      th:text="${c.placesRestantes} + ' place(s)'"></span>
            </li>
        </ul>
        <button class="btn btn-danger" type="submit">Confirmer</button>
    </form>
    <p class="text-muted" th:if="${#lists.isEmpty(creneaux)}">Aucun creneau disponible ce jour.</p>
    <a class="btn btn-link mt-3" th:href="@{/donneur/hopitaux}">Retour aux hopitaux</a>
</div>
</body>
</html>
