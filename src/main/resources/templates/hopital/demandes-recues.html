<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Demandes reçues')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container my-4">
    <h2 class="mb-3">Demandes reçues</h2>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <form class="row g-2 mb-3" method="get" th:action="@{/hopital/demandes/recues}">
        <div class="col-auto">
            <select name="urgence" class="form-select">
                <option value="">Toutes les urgences</option>
                <option th:each="u : ${urgences}" th:value="${u}" th:text="${u}" th:selected="${u == urgence}"></option>
            </select>
        </div>
        <div class="col-auto"><button class="btn btn-outline-danger">Filtrer</button></div>
    </form>

    <table class="table table-striped align-middle">
        <thead>
        <tr><th>Date</th><th>Hôpital demandeur</th><th>Lignes</th><th>Statut</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="d : ${page.content}">
            <td th:text="${#temporals.format(d.dateDemande, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${d.hopitalDemandeur.nom}"></td>
            <td>
                <div th:each="l : ${d.lignes}">
                    <span th:text="${l.quantite} + ' x ' + ${l.typeProduit} + ' ' + ${l.groupeSanguin.code}"></span>
                    <span class="badge"
                          th:classappend="${l.urgence.name() == 'CRITIQUE'} ? 'bg-danger' : (${l.urgence.name() == 'URGENTE'} ? 'bg-warning text-dark' : 'bg-secondary')"
                          th:text="${l.urgence}"></span>
                </div>
            </td>
            <td><span class="badge bg-info text-dark" th:text="${d.statut}"></span></td>
            <td><a class="btn btn-sm btn-danger" th:href="@{/hopital/demandes/recues/{id}(id=${d.id})}">Traiter</a></td>
        </tr>
        </tbody>
    </table>
    <p class="text-muted" th:if="${page.empty}">Aucune demande reçue.</p>

    <div th:replace="~{fragments/layout :: pagination(${page}, ${baseUrl})}"></div>
</div>
</body>
</html>
