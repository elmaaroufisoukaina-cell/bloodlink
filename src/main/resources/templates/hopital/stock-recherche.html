<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Stock des autres hopitaux')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <h2>Stock des autres hopitaux</h2>
    <p class="text-muted">Lecture seule. Les groupes compatibles sont inclus.</p>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <form class="row g-2 mb-3" method="get" th:action="@{/hopital/stock}">
        <div class="col-auto">
            <select name="groupeId" class="form-select">
                <option value="0">Tous les groupes</option>
                <option th:each="g : ${groupes}" th:value="${g.id}" th:text="${g.code}"
                        th:selected="${g.id == groupeId}"></option>
            </select>
        </div>
        <div class="col-auto">
            <select name="type" class="form-select">
                <option value="">Tous les produits</option>
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}" th:selected="${t == type}"></option>
            </select>
        </div>
        <div class="col-auto">
            <input type="text" name="ville" th:value="${ville}" class="form-control" placeholder="Ville">
        </div>
        <div class="col-auto">
            <button class="btn btn-danger">Rechercher</button>
        </div>
    </form>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Hopital</th>
            <th>Ville</th>
            <th>Groupe</th>
            <th>Produit</th>
            <th>Poches</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${resultats}">
            <td th:text="${r.hopital.nom}"></td>
            <td th:text="${r.hopital.ville}"></td>
            <td th:text="${r.groupe}"></td>
            <td th:text="${r.type}"></td>
            <td th:text="${r.quantite}"></td>
            <td>
                <a class="btn btn-sm btn-outline-danger"
                   th:href="@{/hopital/demandes/nouvelle(fournisseurId=${r.hopital.id}, groupeId=${groupeId}, type=${r.type})}">
                    Demander</a>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="text-muted" th:if="${#lists.isEmpty(resultats)}">Aucun resultat.</p>
</div>
</body>
</html>
