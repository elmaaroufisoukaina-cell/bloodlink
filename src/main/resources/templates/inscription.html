<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inscription')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4" style="max-width: 700px;">
    <h2 class="mb-3">Inscription donneur</h2>

    <form th:action="@{/inscription}" th:object="${form}" method="post">

        <!-- erreurs de validation -->
        <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
            <div th:each="e : ${#fields.errors('*')}" th:text="${e}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Mot de passe</label>
                <input type="password" th:field="*{motDePasse}" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Nom</label>
                <input type="text" th:field="*{nom}" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Prenom</label>
                <input type="text" th:field="*{prenom}" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">CIN</label>
                <input type="text" th:field="*{cin}" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Date de naissance</label>
                <input type="date" th:field="*{dateNaissance}" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Sexe</label>
                <select th:field="*{sexe}" class="form-select">
                    <option value="">--</option>
                    <option value="HOMME">Homme</option>
                    <option value="FEMME">Femme</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Poids (kg)</label>
                <input type="number" step="0.1" th:field="*{poidsKg}" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Groupe sanguin</label>
                <select th:field="*{groupeId}" class="form-select">
                    <option value="">--</option>
                    <option th:each="g : ${groupes}" th:value="${g.id}" th:text="${g.code}"></option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Telephone</label>
                <input type="text" th:field="*{telephone}" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Ville</label>
                <input type="text" th:field="*{ville}" class="form-control">
            </div>
        </div>

        <button type="submit" class="btn btn-danger">Creer mon compte</button>
        <a class="btn btn-link" th:href="@{/login}">J'ai deja un compte</a>
    </form>
</div>
</body>
</html>
