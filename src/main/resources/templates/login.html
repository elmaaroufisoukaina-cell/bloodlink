<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Connexion')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-5" style="max-width: 420px;">
    <h2 class="mb-4 text-center">Connexion</h2>

    <div class="alert alert-danger" th:if="${param.error}">Email ou mot de passe incorrect.</div>
    <div class="alert alert-success" th:if="${param.logout}">Vous etes deconnecte.</div>
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <!-- spring security attend les noms username et password -->
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-danger w-100">Se connecter</button>
    </form>

    <p class="mt-3 text-center">Pas encore de compte ? <a th:href="@{/inscription}">Inscription donneur</a>
    </p>
</div>
</body>
</html>
