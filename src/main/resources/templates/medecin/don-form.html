<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nouveau don')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container my-4" style="max-width: 720px;">
    <h2 class="mb-3">Enregistrer un don</h2>
    <p class="text-muted">Saisissez le CIN du donneur et remplissez le questionnaire d'éligibilité.
        Le système décide si le don est réalisé ou refusé.</p>

    <form th:action="@{/medecin/don}" th:object="${donForm}" method="post">

        <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
            <div th:each="e : ${#fields.errors('*')}" th:text="${e}"></div>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">CIN du donneur</label>
                <input type="text" th:field="*{cin}" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label">Type de don</label>
                <select th:field="*{typeDon}" class="form-select">
                    <option value="SANG_TOTAL">Sang total</option>
                    <option value="AFERESE">Aphérèse</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Volume (ml)</label>
                <input type="number" th:field="*{volumeMl}" class="form-control">
            </div>

            <div class="col-md-4">
                <label class="form-label">Poids mesuré (kg)</label>
                <input type="number" step="0.1" th:field="*{poidsKg}" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">Hémoglobine (g/dl)</label>
                <input type="number" step="0.1" th:field="*{hemoglobine}" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">Tension systolique</label>
                <input type="number" th:field="*{tensionSystolique}" class="form-control">
            </div>

            <div class="col-12">
                <div class="form-check">
                    <input type="checkbox" th:field="*{voyageRecent}" class="form-check-input">
                    <label class="form-check-label" for="voyageRecent">Voyage récent en zone à risque</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" th:field="*{tatouageRecent}" class="form-check-input">
                    <label class="form-check-label" for="tatouageRecent">Tatouage récent</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" th:field="*{sousTraitement}" class="form-check-input">
                    <label class="form-check-label" for="sousTraitement">Donneur sous traitement</label>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-danger mt-4">Valider le questionnaire et enregistrer</button>
    </form>
</div>
</body>
</html>
