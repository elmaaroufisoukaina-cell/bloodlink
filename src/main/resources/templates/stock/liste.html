<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Stock')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container my-4">
    <h2 class="mb-3">Stock de mon hôpital</h2>
    <div th:replace="~{fragments/layout :: messages}"></div>

    <!-- jauges par groupe sanguin -->
    <div class="row mb-4">
        <div class="col-6 col-md-3 mb-3" th:each="g : ${jauges}">
            <div class="card card-stat h-100">
                <div class="card-body py-2">
                    <div class="d-flex justify-content-between">
                        <span class="jauge-label" th:text="${g.code}">O-</span>
                        <span th:text="${g.quantite} + ' / ' + ${g.seuil}">3 / 10</span>
                    </div>
                    <div class="progress" style="height: 14px;">
                        <div class="progress-bar" th:classappend="${g.enAlerte} ? 'bg-danger' : 'bg-success'"
                             th:style="'width:' + ${g.pourcentage} + '%'"></div>
                    </div>
                    <small class="text-danger" th:if="${g.enAlerte}">Sous le seuil d'alerte</small>
                </div>
            </div>
        </div>
    </div>

    <!-- filtre par statut -->
    <form class="row g-2 mb-3" method="get" th:action="@{/stock}">
        <div class="col-auto">
            <select name="statut" class="form-select">
                <option value="">Tous les statuts</option>
                <option th:each="s : ${statuts}" th:value="${s}" th:text="${s}" th:selected="${s == statut}"></option>
            </select>
        </div>
        <div class="col-auto"><button class="btn btn-outline-danger">Filtrer</button></div>
        <div class="col-auto ms-auto">
            <a class="btn btn-danger" th:href="@{/stock/poches/nouvelle}">Ajouter une poche</a>
            <a class="btn btn-outline-danger" th:href="@{/stock/alerte}">Alerte pénurie</a>
        </div>
    </form>

    <table class="table table-striped align-middle">
        <thead>
        <tr><th>N° de série</th><th>Produit</th><th>Groupe</th><th>Volume</th><th>Prélèvement</th>
            <th>Péremption</th><th>Statut</th><th>Actions</th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${page.content}" th:classappend="${p.statut.name() == 'PERIMEE'} ? 'table-danger'">
            <td th:text="${p.numeroSerie}"></td>
            <td th:text="${p.typeProduit}"></td>
            <td th:text="${p.don.donneur.groupeSanguin.code}"></td>
            <td th:text="${p.volumeMl} + ' ml'"></td>
            <td th:text="${#temporals.format(p.datePrelevement, 'dd/MM/yyyy')}"></td>
            <td th:text="${#temporals.format(p.datePeremption, 'dd/MM/yyyy')}"></td>
            <td>
                <span class="badge" th:text="${p.statut}"
                      th:classappend="${p.statut.name() == 'DISPONIBLE'} ? 'bg-success' : (${p.statut.name() == 'SERVIE'} ? 'bg-primary' : 'bg-danger')"></span>
            </td>
            <td class="text-nowrap">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/stock/poches/{id}/tracer(id=${p.id})}">Tracer</a>
                <a class="btn btn-sm btn-outline-primary" th:if="${p.statut.name() != 'SERVIE'}"
                   th:href="@{/stock/poches/{id}/modifier(id=${p.id})}">Modifier</a>
                <form class="d-inline" method="post" th:if="${p.statut.name() == 'DISPONIBLE'}"
                      th:action="@{/stock/poches/{id}/perimer(id=${p.id})}">
                    <button class="btn btn-sm btn-outline-warning">Périmer</button>
                </form>
                <form class="d-inline" method="post" th:if="${p.statut.name() != 'SERVIE'}"
                      th:action="@{/stock/poches/{id}/supprimer(id=${p.id})}"
                      onsubmit="return confirm('Supprimer cette poche ?');">
                    <button class="btn btn-sm btn-outline-danger">Supprimer</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="text-muted" th:if="${page.empty}">Aucune poche.</p>

    <div th:replace="~{fragments/layout :: pagination(${page}, ${baseUrl})}"></div>
</div>
</body>
</html>
